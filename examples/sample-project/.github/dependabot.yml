# Weekly grouped patch/minor updates; majors get their own PR. Uncomment the ecosystems the repo uses.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"], update-types: [minor, patch] }
    commit-message: { prefix: "ci(deps)" }
