# Golden task: an untested function; the agent's tests must pass on it and fail on a planted bug.
agent: test
seed: issue
title: "[canary] Add tests for canary/money.py"
body: Add unit tests for `round_money` in `canary/money.py`. Do not change the function.
files:
  canary/money.py: |
    from decimal import ROUND_HALF_UP, Decimal


    def round_money(value: str) -> Decimal:
        """Round to cents, halves away from zero."""
        return Decimal(value).quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)
bug:
  canary/money.py: |
    from decimal import Decimal


    def round_money(value: str) -> Decimal:
        """Round to cents, halves away from zero."""
        return Decimal(value).quantize(Decimal("0.01"))
command: python -m pytest -q tests
rubric: The new tests pass on round_money and fail once the planted bug (banker's rounding) is in.
