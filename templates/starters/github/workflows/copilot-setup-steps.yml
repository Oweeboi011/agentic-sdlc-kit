# Copilot coding agent environment: install the same toolchain as CI before the agent starts.
# GitHub requires this file name and the job name `copilot-setup-steps`.
name: Copilot setup steps
on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]
  push:
    branches: [main]
    paths: [.github/workflows/copilot-setup-steps.yml]
permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Add the install commands your gate needs, e.g. `pip install -r requirements-dev.txt` or `npm ci`.
