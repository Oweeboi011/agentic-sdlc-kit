name: Bug
description: Something is broken.
labels: ["bug", "needs-refinement"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Steps to reproduce, expected vs actual. }
    validations: { required: true }
  - type: input
    id: requirement
    attributes: { label: Requirement, description: "The spec requirement it breaks, if known (e.g. FR-003)." }
  - type: input
    id: env
    attributes: { label: Environment, description: "local / dev / staging / prod, browser, commit" }
  - type: textarea
    id: evidence
    attributes: { label: Evidence, description: Logs, request IDs, screenshots. No secrets or personal data. }
