# Reusable: build the app and run Playwright; the HTML report is uploaded when the run fails.
name: e2e-playwright
on:
  workflow_call:
    inputs:
      package-directory:
        description: Folder holding package.json, package-lock.json and the Playwright config
        type: string
        default: "."
      node-version:
        description: Node.js version for actions/setup-node
        type: string
        default: "22"
      python-version:
        description: Also set up Python, for test commands written in Python; empty skips it
        type: string
        default: ""
      browsers:
        description: Browsers for `playwright install --with-deps`
        type: string
        default: chromium
      build:
        description: Build command, run in package-directory; empty skips it
        type: string
        default: npm run build
      test:
        description: Test command, run from the repo root ($PACKAGE_DIR = package-directory)
        type: string
        default: cd "$PACKAGE_DIR" && npx playwright test
      report-directory:
        description: Playwright HTML report folder, relative to package-directory
        type: string
        default: playwright-report
      timeout-minutes:
        description: Job timeout
        type: number
        default: 20
permissions:
  contents: read

jobs:
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      PACKAGE_DIR: ${{ inputs.package-directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: inputs.python-version != ''
        with:
          python-version: ${{ inputs.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.package-directory }}/package-lock.json
      - name: Install
        working-directory: ${{ inputs.package-directory }}
        env:
          BROWSERS: ${{ inputs.browsers }}
        run: |
          npm ci
          read -r -a browsers <<< "$BROWSERS"
          npx playwright install --with-deps "${browsers[@]}"
      - name: Build
        if: inputs.build != ''
        working-directory: ${{ inputs.package-directory }}
        env:
          BUILD: ${{ inputs.build }}
        run: bash -euo pipefail -c "$BUILD"
      - name: Test
        env:
          TEST: ${{ inputs.test }}
        run: bash -euo pipefail -c "$TEST"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: ${{ inputs.package-directory }}/${{ inputs.report-directory }}
          if-no-files-found: ignore
          retention-days: 7
