# Push tag vX.Y.Z from main: publishes the GitHub release from CHANGELOG.md and moves tag vX.
name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag is on main and matches pyproject and preset versions
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          [ "v$version" = "$TAG" ] || { echo "::error::pyproject version $version does not match $TAG"; exit 1; }
          preset=$(yq -r '.preset.version' presets/spec-kit/preset.yml)
          [ "$preset" = "$version" ] || { echo "::error::preset version $preset does not match $version"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
      - name: Spec Kit preset archive (specify preset add --from <asset URL>)
        working-directory: presets/spec-kit
        run: zip -qr "$RUNNER_TEMP/spec-kit-preset.zip" .
      # ADR-0026: the canary repo must have passed on this exact commit (dispatch `kit-candidate` with its sha).
      - name: Canary passed on this commit
        env:
          CANARY_REPO: ${{ vars.CANARY_REPO }}
          CANARY_TOKEN: ${{ secrets.CANARY_READ_TOKEN }}
        run: |
          if [ -z "$CANARY_REPO" ]; then
            echo "::notice::vars.CANARY_REPO is not set; the canary gate is off until the canary repo exists"; exit 0
          fi
          titles=$(GH_TOKEN="${CANARY_TOKEN:-$GH_TOKEN}" gh run list -R "$CANARY_REPO" --workflow canary.yml             --status success --limit 50 --json displayTitle -q '.[].displayTitle')
          grep -qx "canary $GITHUB_SHA" <<< "$titles"             || { echo "::error::No passing canary for $GITHUB_SHA in $CANARY_REPO; dispatch kit-candidate first"; exit 1; }
      - name: Publish release
        run: gh release create "$TAG" "$RUNNER_TEMP/spec-kit-preset.zip" --title "$TAG" --notes-file notes.md --verify-tag
      - name: Move major tag
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
