# Reusable: fail when files rendered by kit-sync are missing, stale or hand-edited.
# Kit version = `kit` in .github/astral-kit.yml unless `kit-version` is set.
name: kit-drift
on:
  workflow_call:
    inputs:
      kit-version:
        description: Kit tag to check against (v0 or v0.1.0); empty reads `kit` from .github/astral-kit.yml
        type: string
        default: ""
      kit-repository:
        description: Kit repository (owner/name)
        type: string
        default: Oweeboi011/agentic-sdlc-kit
    secrets:
      kit-token:
        description: Read-only token for the kit repository, needed while it is not public
        required: false
permissions:
  contents: read

jobs:
  drift:
    name: kit drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KIT_VERSION: ${{ inputs.kit-version }}
      KIT_REPOSITORY: ${{ inputs.kit-repository }}
      KIT_TOKEN: ${{ secrets.kit-token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: kit-sync --check
        run: |
          version="${KIT_VERSION:-$(yq -r '.kit // ""' .github/astral-kit.yml)}"
          [ -n "$version" ] || { echo "::error::Set kit in .github/astral-kit.yml or the kit-version input"; exit 1; }
          # Token via git's env config: it stays off command lines and out of the pipx spec.
          if [ -n "$KIT_TOKEN" ]; then
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_VALUE_0="https://github.com/"
            export GIT_CONFIG_KEY_0="url.https://x-access-token:${KIT_TOKEN}@github.com/.insteadOf"
          fi
          pipx run --python python3 --spec "git+https://github.com/$KIT_REPOSITORY@$version" kit-sync --check \
            || { echo "::error::Rendered kit files drifted. Run kit-sync locally and commit the result."; exit 1; }
