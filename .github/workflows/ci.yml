name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The kit runs its own reusable workflows, so every PR exercises them.
  python:
    name: python (${{ matrix.python }})
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    uses: ./.github/workflows/ci-python.yml
    with:
      python-version: ${{ matrix.python }}
      cache-dependency-path: pyproject.toml
      install: python -m pip install -e ".[dev]"
      gate: |
        python -m ruff check .
        python -m ruff format --check .
        python -m pytest -q
        kit-sync --version
        kit-sync --validate
      timeout-minutes: 10

  security:
    name: security
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/security.yml

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
