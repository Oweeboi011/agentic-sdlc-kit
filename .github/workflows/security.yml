# Reusable: gitleaks over the full history; on pull requests also dependency review (high+ fails).
# Callers grant `contents: read` and `pull-requests: write` (the review comments a summary on failure).
name: security
on:
  workflow_call:
    inputs:
      gitleaks-config:
        description: Path to a gitleaks config in the repo; empty uses the gitleaks defaults
        type: string
        default: ""
      fail-on-severity:
        description: Lowest vulnerability severity that fails dependency review
        type: string
        default: high
permissions:
  contents: read

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      CONFIG: ${{ inputs.gitleaks-config }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$archive" "$base/$archive"
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o checksums.txt \
            "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan history
        run: |
          args=(git --redact --no-banner)
          [ -z "$CONFIG" ] || args+=(--config "$CONFIG")
          gitleaks "${args[@]}" .

  dependencies:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          comment-summary-in-pr: on-failure
