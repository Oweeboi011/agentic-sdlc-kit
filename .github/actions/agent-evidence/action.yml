# Marks an agent's output with the kit evidence marker so ASTRAL can count it (ADR-0026). Run by the
# workflow after the agent, `if: always()`, so the model can neither skip nor forge it. Writes the step
# summary and outputs `count` and `evidence-url`. Only bot-authored items created since `since` count.
name: agent-evidence
description: Append the agentic-sdlc-kit evidence marker to an agent's comment, PR, Issue or draft release
inputs:
  agent:
    description: Kit agent name, e.g. planner
    required: true
  kind:
    description: issue_comment | pr_comment | pr | issue | release (the agent's evidence.kind)
    required: true
  label:
    description: Agent label put on PR and Issue outputs, e.g. agent:claude
    required: true
  since:
    description: ISO-8601 UTC time the job started; older items are not this run's output
    required: true
  number:
    description: Issue or PR number whose comments to mark (issue_comment, pr_comment)
    default: ""
  branch:
    description: Head branch of the agent's PR (pr)
    default: ""
  filter-label:
    description: Only Issues carrying this label (issue), e.g. from-feedback
    default: ""
  model:
    description: Model or deployment the agent ran on; empty is the action default
    default: ""
  token:
    description: Token that can edit the output (the agent's token)
    required: true
outputs:
  count:
    description: Outputs marked
    value: ${{ steps.mark.outputs.count }}
  evidence-url:
    description: First marked output
    value: ${{ steps.mark.outputs.url }}
runs:
  using: composite
  steps:
    - id: mark
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        AGENT: ${{ inputs.agent }}
        KIND: ${{ inputs.kind }}
        LABEL: ${{ inputs.label }}
        SINCE: ${{ inputs.since }}
        NUMBER: ${{ inputs.number }}
        BRANCH: ${{ inputs.branch }}
        FILTER: ${{ inputs.filter-label }}
        MODEL: ${{ inputs.model }}
      run: |
        set -euo pipefail
        if [ -z "$SINCE" ]; then
          echo "::warning::$AGENT did not start; nothing to mark"; echo "count=0" >> "$GITHUB_OUTPUT"; exit 0
        fi
        repo="$GITHUB_REPOSITORY"
        kit=unknown
        for f in ".claude/agents/$AGENT.md" ".github/agents/$AGENT.agent.md"; do
          v=$(grep -oE 'generated by agentic-sdlc-kit v[^;]+' "$f" 2>/dev/null | head -1 | awk '{print $NF}' || true)
          [ -z "$v" ] || { kit="$v"; break; }
        done
        marker="<!-- agentic-sdlc-kit agent=$AGENT kit=$kit run=$GITHUB_RUN_ID model=${MODEL:-default} -->"
        recent='select(.user.type == "Bot" and .created_at >= env.SINCE)'
        row='[.number // .id, .html_url, ((.body // "") | @base64)] | @tsv'
        case "$KIND" in
          issue_comment|pr_comment)
            items=$(gh api --paginate "repos/$repo/issues/$NUMBER/comments?since=$SINCE" --jq ".[] | $recent | $row")
            edit="repos/$repo/issues/comments" ;;
          pr)
            items=$(gh api "repos/$repo/pulls?head=${repo%%/*}:$BRANCH&state=open" --jq ".[] | $row")
            edit="repos/$repo/pulls" ;;
          issue)
            items=$(gh api --paginate "repos/$repo/issues?labels=$FILTER&state=all&since=$SINCE" \
              --jq ".[] | select(.pull_request == null) | $recent | $row")
            edit="repos/$repo/issues" ;;
          release)
            items=$(gh api "repos/$repo/releases?per_page=30" --jq ".[] | select(.draft and .created_at >= env.SINCE) | $row")
            edit="repos/$repo/releases" ;;
          *) echo "::error::unknown evidence kind $KIND"; exit 1 ;;
        esac
        count=0; first=""
        while IFS=$'\t' read -r id url body64; do
          [ -n "$id" ] || continue
          body=$(base64 -d <<< "$body64")
          if [[ "$body" != *"agentic-sdlc-kit agent=$AGENT "* ]]; then
            gh api -X PATCH "$edit/$id" -f body="${body}"$'\n\n'"${marker}" > /dev/null
          fi
          if [ "$KIND" = pr ] || [ "$KIND" = issue ]; then
            gh api "repos/$repo/issues/$id/labels" -f "labels[]=$LABEL" > /dev/null
          fi
          count=$((count + 1)); first=${first:-$url}
          echo "- $url" >> "$RUNNER_TEMP/evidence.md"
        done <<< "$items"
        {
          echo "### Agent evidence: $AGENT"
          echo "Kind \`$KIND\`, kit \`$kit\`, model \`${MODEL:-default}\`, run \`$GITHUB_RUN_ID\`: $count output(s)."
          cat "$RUNNER_TEMP/evidence.md" 2>/dev/null || true
        } >> "$GITHUB_STEP_SUMMARY"
        [ "$count" -gt 0 ] || echo "::warning::$AGENT produced no $KIND this run"
        echo "count=$count" >> "$GITHUB_OUTPUT"
        echo "url=$first" >> "$GITHUB_OUTPUT"
