[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc-kit"
version = "0.2.0"
description = "Renders agents, skills and instructions for GitHub Copilot and Claude Code from one source."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.23"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
kit-sync = "kit_sync.cli:main"
kit-canary = "kit_sync.canary:main"
kit-decisions = "kit_sync.decisions:main"
kit-check = "kit_sync.checks:main"

[tool.setuptools]
packages = [
    "kit_sync",
    "kit_sync.schemas",
    "kit_sync.agents",
    "kit_sync.skills",
    "kit_sync.instructions",
    "kit_sync.mcp",
    "kit_sync.templates",
    "kit_sync.policies",
    "kit_sync.presets",
]

# Kit content ships inside the package so `pipx run` finds it (kit_sync/paths.py).
[tool.setuptools.package-dir]
"kit_sync.schemas" = "schemas"
"kit_sync.agents" = "agents"
"kit_sync.skills" = "skills"
"kit_sync.instructions" = "instructions"
"kit_sync.mcp" = "mcp"
"kit_sync.templates" = "templates"
"kit_sync.policies" = "policies"
"kit_sync.presets" = "presets"

[tool.setuptools.package-data]
"kit_sync.schemas" = ["*.json"]
"kit_sync.agents" = ["*.md"]
"kit_sync.skills" = ["*/SKILL.md"]
"kit_sync.instructions" = ["*.md"]
"kit_sync.mcp" = ["*.json"]
"kit_sync.templates" = ["**/*"]
"kit_sync.policies" = ["*.json"]
"kit_sync.presets" = ["**/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
